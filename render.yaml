services:
  - type: web
    name: zubahouse-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      # Public Web client ID (same as mobile app.json extra.expoClientId)
      - key: GOOGLE_CLIENT_ID
        value: 435369151234-8e7sb5ferci9ti2472vdmf6ose5e6nss.apps.googleusercontent.com
      # Set in Render Dashboard → Environment (never commit). If leaked, rotate in Google Cloud.
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Fallback redirect_uri for Google token exchange (must match app: zuba://redirect)
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: "zuba://redirect"
    plan: free

